<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單後台系統</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #F7F6F2; color: #222; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.sub { font-size: 14px; color: #777; margin: 0 0 20px; }
  #loginBox { max-width: 320px; margin: 100px auto; text-align: center; }
  #loginBox button { width: 100%; height: 52px; background: #222; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;}
  #headerRow { display: flex; justify-content: space-between; align-items: center; }
  #soundToggle { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  #tabs { display: flex; gap: 8px; margin: 18px 0; }
  .tab-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 15px; font-weight: 500; }
  .tab-btn.active { background: #222; color: #fff; border-color: #222; }
  #summary { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: #fff; border-radius: 12px; padding: 14px 20px; border: 1px solid #ddd; }
  .stat-label { font-size: 13px; color: #777; margin: 0 0 4px; }
  .stat-value { font-size: 24px; font-weight: 600; margin: 0; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; font-size: 15px; border-bottom: 1px solid #eee; }
  th { color: #777; font-size: 13px; font-weight: 500; background: #fafafa; }
  
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #eee; }
  .tag.dinein { background: #FAECE7; color: #993C1D; }
  .tag.takeout { background: #E1F5EE; color: #0F6E56; }
  .tag.ubereats { background: #E6F5EC; color: #06C167; }
  .tag.line { background: #E1F0FF; color: #0B5FBF; }
  .tag.counter { background: #FFF3D6; color: #8A6100; }
  
  .emptyMsg { text-align: center; color: #999; padding: 40px 0; display: none; }
  .updatedAt { font-size: 12px; color: #999; margin-top: 14px; }
  .complete-btn { background: #0F6E56; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .complete-btn:disabled { background: #ccc; cursor: not-allowed; }
  
  .flavor { border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #ddd; background: #fff; }
  .flavor.selected { border: 2px solid #D85A30; }
  .flavor.soldout { opacity: 0.5; }
  .flavor-row { display: flex; justify-content: space-between; align-items: center; }
  .flavor-name { font-size: 15px; font-weight: 600; }
  .flavor-price { font-size: 13px; color: #777; margin-top: 3px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; }
  .badge.out { background: #eee; color: #999; }
  
  .cart-controls { display: flex; align-items: center; justify-content: flex-end; margin-top: 10px; gap: 14px; }
  .cart-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #222; }
  .cart-qty { font-size: 16px; font-weight: 600; min-width: 24px; text-align: center; }
  label.field-label { font-size: 13px; color: #777; display: block; margin: 18px 0 6px; }
  select, input { width: 100%; height: 44px; border-radius: 8px; border: 1px solid #ccc; padding: 0 10px; font-size: 16px; box-sizing: border-box; }
  
  .dine-options { display: flex; gap: 8px; }
  .dine-option { flex: 1; text-align: center; padding: 12px 4px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; }
  .dine-option.selected { border: 2px solid #D85A30; font-weight: 600; }
  
  #counterTotalRow { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; }
  #counterTotalRow span:first-child { font-size: 13px; color: #777; }
  #counterTotalRow span:last-child { font-size: 24px; font-weight: 600; color: #D85A30; }
  #counterSubmitBtn { width: 100%; height: 48px; margin-top: 14px; background: #222; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; }
  #counterErrorMsg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
  #counterSuccessMsg { color: #0F6E56; font-size: 13px; margin-top: 8px; display: none; }
  option:disabled { color: #999; font-style: italic; text-align: center; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>訂單後台系統</h1>
  <p class="sub">點擊下方按鈕即可進入與開啟音效</p>
  <button id="loginBtn">進入系統</button>
  <p id="loginError" style="color:#c0392b;font-size:13px;display:none">連線失敗，請確認網路與網址</p>
</div>

<div id="dashboard" style="display:none">
  <div id="headerRow">
    <div>
      <h1>今日訂單</h1>
      <p class="sub" id="dateLabel"></p>
    </div>
    <button id="soundToggle">🔔 音效開</button>
  </div>

  <div id="tabs">
    <button class="tab-btn active" id="tabOrders">待處理</button>
    <button class="tab-btn" id="tabCompleted">已完成明細</button>
    <button class="tab-btn" id="tabCounter">櫃檯點餐</button>
  </div>

  <div id="summary" style="display:none;"></div>

  <!-- 待處理視窗 (增加備註標題) -->
  <div id="ordersView">
    <table id="orderTable">
      <thead>
        <tr><th>時間</th><th>來源</th><th>姓名 / 電話</th><th>口味</th><th>數量</th><th>內用/外帶/UE</th><th>金額</th><th>備註</th><th>操作</th></tr>
      </thead>
      <tbody id="orderBody"></tbody>
    </table>
    <p id="emptyMsg" class="emptyMsg">目前沒有待處理的訂單</p>
    <p id="updatedAt" class="updatedAt"></p>
  </div>

  <!-- 已完成視窗 (增加備註標題) -->
  <div id="completedView" style="display:none">
    <table id="completedTable">
      <thead>
        <tr><th>時間</th><th>來源</th><th>姓名 / 電話</th><th>口味</th><th>數量</th><th>內用/外帶/UE</th><th>金額</th><th>備註</th><th>狀態</th></tr>
      </thead>
      <tbody id="completedBody"></tbody>
    </table>
    <p id="completedEmptyMsg" class="emptyMsg">目前沒有已完成的訂單</p>
    <p id="completedUpdatedAt" class="updatedAt"></p>
  </div>

  <!-- 櫃檯點餐視窗 -->
  <div id="counterView" style="display:none">
    <div id="counterFlavors"></div>
    <label class="field-label">用餐方式</label>
    <div class="dine-options">
      <div class="dine-option selected" data-value="內用">內用</div>
      <div class="dine-option" data-value="外帶">外帶</div>
      <div class="dine-option" data-value="Uber Eats">Uber Eats</div>
    </div>
    <label class="field-label">取餐時間</label>
    <select id="counterPickupTime"></select>
    <label class="field-label">外送單號或桌號(選填)</label>
    <input type="text" id="counterCustomerName" placeholder="例如:3號桌 / UE 888">
    
    <label class="field-label">聯絡電話(選填)</label>
    <input type="tel" id="counterCustomerPhone" placeholder="例如:0912345678">

    <!-- 💡 櫃檯也支援備註輸入 -->
    <label class="field-label">備註(選填)</label>
    <input type="text" id="counterRemark" placeholder="例如:加辣、自備餐具">

    <div id="counterTotalRow">
      <span>總金額</span>
      <span id="counterTotalPrice">$0</span>
    </div>
    <button id="counterSubmitBtn">送出點餐</button>
    <p id="counterErrorMsg"></p>
    <p id="counterSuccessMsg"></p>
  </div>
</div>

<script>
// ===== 請修改以下設定 =====
var API_URL = "https://script.google.com/macros/s/AKfycbz0iwuiklK29eAVtoqNAQKdIjFv3CZpkunf_oJT8HgOxneSl_ra5Reqdiyr3jhfsJXv/exec";
var REFRESH_SECONDS = 15;
// ============================

var audioCtx = null;
var soundEnabled = true;
var knownOrderIds = null;
var latestMenu = [];
var isSystemActive = false;

function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function playTone(freq, startTime, duration) {
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(0.3, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration);
}
function playDing() {
  if (!soundEnabled || !audioCtx) return;
  var t = audioCtx.currentTime;
  playTone(880, t, 0.22);
  playTone(660, t + 0.24, 0.28);
}
document.getElementById("soundToggle").addEventListener("click", function() {
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? "🔔 音效開" : "🔕 音效關";
  if (soundEnabled) unlockAudio();
});

document.getElementById("tabOrders").addEventListener("click", function() {
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  this.classList.add("active");
  document.getElementById("summary").style.display = "flex";
  document.getElementById("ordersView").style.display = "block";
  document.getElementById("completedView").style.display = "none";
  document.getElementById("counterView").style.display = "none";
});
document.getElementById("tabCompleted").addEventListener("click", function() {
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  this.classList.add("active");
  document.getElementById("summary").style.display = "none"; 
  document.getElementById("ordersView").style.display = "none";
  document.getElementById("completedView").style.display = "block";
  document.getElementById("counterView").style.display = "none";
});
document.getElementById("tabCounter").addEventListener("click", function() {
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  this.classList.add("active");
  document.getElementById("summary").style.display = "none";
  document.getElementById("ordersView").style.display = "none";
  document.getElementById("completedView").style.display = "none";
  document.getElementById("counterView").style.display = "block";
});

document.getElementById("loginBtn").addEventListener("click", function() {
  unlockAudio();
  document.getElementById("loginBtn").textContent = "載入中...";
  document.getElementById("loginBtn").disabled = true;
  fetchData(true);
});

function fetchData(isFirstLoad) {
  fetch(API_URL + "?admin=1")
    .then(function(res) { return res.json(); })
    .then(function(data) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      
      if (document.getElementById("tabOrders").classList.contains("active")) {
        document.getElementById("summary").style.display = "flex";
      }

      isSystemActive = true;
      latestMenu = data.menu || [];
      checkNewOrders(data.orders || []);
      
      renderOrders(latestMenu, data.orders || [], data.completed_orders || [], data.today_revenue || 0);
      renderCounterFlavors();
    })
    .catch(function() {
      if (isFirstLoad) {
        document.getElementById("loginError").style.display = "block";
        document.getElementById("loginBtn").textContent = "進入系統";
        document.getElementById("loginBtn").disabled = false;
      }
    });
}

function checkNewOrders(orders) {
  if (knownOrderIds === null) {
    knownOrderIds = {};
    orders.forEach(function(o) { knownOrderIds[o.order_id] = true; });
    return;
  }
  var hasNew = false;
  orders.forEach(function(o) {
    if (!knownOrderIds[o.order_id]) { knownOrderIds[o.order_id] = true; hasNew = true; }
  });
  if (hasNew) playDing();
}

function renderOrders(menu, orders, completedOrders, todayRevenue) {
  var today = new Date();
  document.getElementById("dateLabel").textContent = today.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "long" });
  
  var summaryEl = document.getElementById("summary");
  summaryEl.innerHTML = "";
  
  var totalQty = orders.reduce(function(sum, o) { return sum + Number(o.qty); }, 0);
  var pendingRevenue = orders.reduce(function(sum, o) { return sum + Number(o.total_price); }, 0);

  var qtyStat = document.createElement("div");
  qtyStat.className = "stat";
  qtyStat.innerHTML = '<p class="stat-label">待處理份數</p><p class="stat-value">' + totalQty + '</p>';
  summaryEl.appendChild(qtyStat);

  var pendingRevStat = document.createElement("div");
  pendingRevStat.className = "stat";
  pendingRevStat.innerHTML = '<p class="stat-label">待處理金額</p><p class="stat-value">$' + pendingRevenue + '</p>';
  summaryEl.appendChild(pendingRevStat);

  var totalRevStat = document.createElement("div");
  totalRevStat.className = "stat";
  totalRevStat.innerHTML = '<p class="stat-label">今日總營業額</p><p class="stat-value" style="color:#D85A30">$' + todayRevenue + '</p>';
  summaryEl.appendChild(totalRevStat);

  menu.forEach(function(f) {
    var stat = document.createElement("div");
    stat.className = "stat";
    stat.innerHTML = '<p class="stat-label">' + f.name + '</p><p class="stat-value">' + f.sold + ' / ' + f.total + '</p>';
    summaryEl.appendChild(stat);
  });

  var timeStr = "更新時間 " + new Date().toLocaleTimeString("zh-TW");

  // 渲染待處理訂單列表
  var body = document.getElementById("orderBody");
  body.innerHTML = "";
  if (orders.length === 0) {
    document.getElementById("orderTable").style.display = "none";
    document.getElementById("emptyMsg").style.display = "block";
  } else {
    document.getElementById("orderTable").style.display = "table";
    document.getElementById("emptyMsg").style.display = "none";
    orders.forEach(function(o) {
      var tagClass = "takeout"; 
      if (o.dine_option === "內用") tagClass = "dinein";
      else if (o.dine_option === "Uber Eats") tagClass = "ubereats";
      
      var sourceClass = o.source === "現場" ? "counter" : "line";
      var sourceLabel = o.source === "現場" ? "現場" : "LINE";
      var phoneHtml = o.phone ? "<br><span style='font-size:12px;color:#777'>" + o.phone + "</span>" : "";
      
      // 💡 渲染備註欄，若有備註則用顯眼橘紅色標示
      var remarkHtml = o.remark ? "<span style='color:#D85A30; font-weight:600; font-size:13px;'>" + o.remark + "</span>" : "-";

      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + o.pickup_time + "</td>" +
        "<td><span class='tag " + sourceClass + "'>" + sourceLabel + "</span></td>" +
        "<td>" + (o.customer_name || "-") + phoneHtml + "</td><td>" + o.flavor_name + "</td><td>" + o.qty +
        "</td><td><span class='tag " + tagClass + "'>" + o.dine_option + "</span></td><td>$" + o.total_price + "</td>" +
        "<td>" + remarkHtml + "</td>" +
        "<td><button class='complete-btn' data-id='" + o.order_id + "'>完成</button></td>";
      body.appendChild(tr);
    });
    
    document.querySelectorAll(".complete-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var orderId = this.getAttribute("data-id");
        this.disabled = true;
        this.textContent = "處理中";
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "complete", order_id: orderId })
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
          if (result.success) fetchData(false);
          else { alert("操作失敗: " + result.message); btn.disabled = false; btn.textContent = "完成"; }
        })
        .catch(function() { alert("網路連線失敗"); btn.disabled = false; btn.textContent = "完成"; });
      });
    });
  }
  document.getElementById("updatedAt").textContent = timeStr;

  // 渲染已完成訂單明細
  var completedBody = document.getElementById("completedBody");
  completedBody.innerHTML = "";
  if (completedOrders.length === 0) {
    document.getElementById("completedTable").style.display = "none";
    document.getElementById("completedEmptyMsg").style.display = "block";
  } else {
    document.getElementById("completedTable").style.display = "table";
    document.getElementById("completedEmptyMsg").style.display = "none";
    completedOrders.forEach(function(o) {
      var tagClass = "takeout"; 
      if (o.dine_option === "內用") tagClass = "dinein";
      else if (o.dine_option === "Uber Eats") tagClass = "ubereats";
      
      var sourceClass = o.source === "現場" ? "counter" : "line";
      var sourceLabel = o.source === "現場" ? "現場" : "LINE";
      var phoneHtml = o.phone ? "<br><span style='font-size:12px;color:#777'>" + o.phone + "</span>" : "";
      
      // 💡 渲染備註欄
      var remarkHtml = o.remark ? "<span style='color:#D85A30; font-weight:600; font-size:13px;'>" + o.remark + "</span>" : "-";

      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + o.pickup_time + "</td>" +
        "<td><span class='tag " + sourceClass + "'>" + sourceLabel + "</span></td>" +
        "<td>" + (o.customer_name || "-") + phoneHtml + "</td><td>" + o.flavor_name + "</td><td>" + o.qty +
        "</td><td><span class='tag " + tagClass + "'>" + o.dine_option + "</span></td><td>$" + o.total_price + "</td>" +
        "<td>" + remarkHtml + "</td>" +
        "<td><span style='color:#999; font-size:13px; font-weight:600;'>已完成</span></td>";
      completedBody.appendChild(tr);
    });
  }
  document.getElementById("completedUpdatedAt").textContent = timeStr;
}

var counterCart = {};
var counterDineOption = "內用";

function renderCounterFlavors() {
  var wrap = document.getElementById("counterFlavors");
  wrap.innerHTML = "";
  latestMenu.forEach(function(f) {
    var soldOut = f.remaining <= 0;
    var currentQty = counterCart[f.flavor_id] || 0;
    var div = document.createElement("div");
    div.className = "flavor" + (currentQty > 0 ? " selected" : "") + (soldOut ? " soldout" : "");
    
    var badgeHtml = soldOut ? '<span class="badge out">已售完</span>' : '';
    
    var html = '<div class="flavor-row"><span class="flavor-name">' + f.name + '</span>' + badgeHtml + '</div>';
    html += '<div class="flavor-price">內用 $' + f.price_dinein + ' / 外帶 $' + f.price_takeout + ' / UE $124</div>';
    
    if (!soldOut) {
      html += '<div class="cart-controls">';
      html += '<button class="cart-btn minus" data-id="' + f.flavor_id + '">−</button>';
      html += '<span class="cart-qty">' + currentQty + '</span>';
      html += '<button class="cart-btn plus" data-id="' + f.flavor_id + '">+</button>';
      html += '</div>';
    }
    div.innerHTML = html;
    wrap.appendChild(div);
  });

  document.querySelectorAll('.cart-btn.minus').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      if (counterCart[id] > 0) {
        counterCart[id]--;
        if (counterCart[id] === 0) delete counterCart[id];
        renderCounterFlavors();
        updateCounterTotal();
      }
    });
  });

  document.querySelectorAll('.cart-btn.plus').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      var f = latestMenu.find(function(x) { return x.flavor_id === id; });
      var current = counterCart[id] || 0;
      if (current < f.remaining && current < 10) {
        counterCart[id] = current + 1;
        renderCounterFlavors();
        updateCounterTotal();
      } else if (current >= f.remaining) {
        alert("剩餘數量不足");
      }
    });
  });
}

function renderCounterPickupOptions() {
  var sel = document.getElementById("counterPickupTime");
  sel.innerHTML = "";
  
  var nowOpt = document.createElement("option");
  nowOpt.value = "立即";
  nowOpt.textContent = "立即製作";
  sel.appendChild(nowOpt);

  var dayOfWeek = new Date().getDay(); 
  var times = [];

  if (dayOfWeek === 3 || dayOfWeek === 4) {
    times = [
      "11:30","11:45","12:00","12:15","12:30","12:45","13:00",
      "--- 晚餐時段 ---",
      "17:30","17:45","18:00","18:15","18:30"
    ];
  } else {
    times = ["11:30","11:45","12:00","12:15","12:30","12:45","13:00"];
  }

  times.forEach(function(t) {
    var opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    if (t === "--- 晚餐時段 ---") {
      opt.disabled = true;
    }
    sel.appendChild(opt);
  });
}

function updateCounterTotal() {
  var total = 0;
  for (var id in counterCart) {
    var f = latestMenu.find(function(x) { return x.flavor_id === id; });
    if (f) {
      var price = 0;
      if (counterDineOption === "內用") {
        price = f.price_dinein;
      } else if (counterDineOption === "外帶") {
        price = f.price_takeout;
      } else if (counterDineOption === "Uber Eats") {
        price = 124;
      }
      total += price * counterCart[id];
    }
  }
  document.getElementById("counterTotalPrice").textContent = "$" + total;
}

document.querySelectorAll(".dine-option").forEach(function(el) {
  el.addEventListener("click", function() {
    document.querySelectorAll(".dine-option").forEach(function(x) { x.classList.remove("selected"); });
    el.classList.add("selected");
    counterDineOption = el.getAttribute("data-value");
    updateCounterTotal(); 
  });
});

document.getElementById("counterSubmitBtn").addEventListener("click", function() {
  var errEl = document.getElementById("counterErrorMsg");
  var okEl = document.getElementById("counterSuccessMsg");
  errEl.style.display = "none";
  okEl.style.display = "none";

  var cartItems = [];
  for (var id in counterCart) {
    cartItems.push({ flavor_id: id, qty: counterCart[id] });
  }

  if (cartItems.length === 0) { errEl.textContent = "請至少選擇一份餐點"; errEl.style.display = "block"; return; }

  var name = document.getElementById("counterCustomerName").value.trim() || "現場客人";
  var phone = document.getElementById("counterCustomerPhone").value.trim() || "";
  var remark = document.getElementById("counterRemark").value.trim() || ""; // 💡 抓取櫃檯備註
  document.getElementById("counterSubmitBtn").disabled = true;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      items: cartItems,
      dine_option: counterDineOption,
      pickup_time: document.getElementById("counterPickupTime").value,
      customer_name: name,
      phone: phone,
      remark: remark, // 💡 傳送櫃檯備註
      source: "現場"
    })
  })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      document.getElementById("counterSubmitBtn").disabled = false;
      if (!result.success) {
        errEl.textContent = result.message || "送出失敗,請再試一次";
        errEl.style.display = "block";
        return;
      }
      okEl.textContent = "送出成功，共 $" + result.total_price;
      okEl.style.display = "block";
      counterCart = {};
      document.getElementById("counterCustomerName").value = "";
      document.getElementById("counterCustomerPhone").value = "";
      document.getElementById("counterRemark").value = ""; // 💡 清空備註
      document.getElementById("counterTotalPrice").textContent = "$0"; 
      fetchData(false);
    })
    .catch(function() {
      document.getElementById("counterSubmitBtn").disabled = false;
      errEl.textContent = "網路連線失敗,請再試一次";
      errEl.style.display = "block";
    });
});

renderCounterPickupOptions();

setInterval(function() {
  if (isSystemActive) fetchData(false);
}, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
