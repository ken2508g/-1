<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telar Studio 預約點餐系統</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 420px; margin: 0 auto; padding: 16px; background: #F7F6F2; color: #222; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: #777; margin: 0 0 20px; }
  .flavor { border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; background: #fff; }
  .flavor.selected { border: 2px solid #D85A30; }
  .flavor.soldout { opacity: 0.5; }
  .flavor-row { display: flex; justify-content: space-between; align-items: center; }
  .flavor-name { font-size: 15px; font-weight: 600; }
  .flavor-price { font-size: 13px; color: #777; margin-top: 4px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; }
  .badge.out { background: #eee; color: #999; }
  .cart-controls { display: flex; align-items: center; justify-content: flex-end; margin-top: 10px; gap: 14px; }
  .cart-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #222; }
  .cart-qty { font-size: 16px; font-weight: 600; min-width: 24px; text-align: center; }
  label.field-label { font-size: 13px; color: #777; display: block; margin: 18px 0 6px; }
  select, input { width: 100%; height: 42px; border-radius: 8px; border: 1px solid #ccc; padding: 0 10px; font-size: 15px; box-sizing: border-box; }
  .dine-options { display: flex; gap: 10px; }
  .dine-option { flex: 1; text-align: center; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; }
  .dine-option.selected { border: 2px solid #D85A30; font-weight: 600; }
  #totalRow { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; }
  #totalRow span:first-child { font-size: 13px; color: #777; }
  #totalRow span:last-child { font-size: 24px; font-weight: 600; color: #D85A30;}
  button#submitBtn { width: 100%; height: 46px; margin-top: 14px; background: #222; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;}
  #errorMsg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
  #confirmCard { display: none; margin-top: 20px; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
  option:disabled { color: #999; font-style: italic; text-align: center; }
  .soldout-notice { color: #D85A30; font-size: 13px; margin-top: 10px; font-weight: 600; text-align: right; }
</style>
</head>
<body>
  <h1>Telar Studio 預約點餐系統</h1>
  <p class="sub">每日限量供應，請準時取餐，預訂後如需取消，請直接在Line留言告訴我們</p>
  <p class="sub">需加入官方Line帳號才能使用此功能</p>
  <div id="flavors"></div>

  <label class="field-label">內用或外帶</label>
  <div class="dine-options">
    <div class="dine-option selected" data-value="內用">內用</div>
    <div class="dine-option" data-value="外帶">外帶</div>
  </div>

  <label class="field-label">取餐時間</label>
  <select id="pickupTime"></select>

  <label class="field-label">姓名(方便取餐時核對)</label>
  <input type="text" id="customerName" placeholder="請輸入姓名">
  
  <label class="field-label">聯絡電話(必填)</label>
  <input type="tel" id="customerPhone" placeholder="請輸入手機號碼">
  
  <!-- 💡 備註欄位 -->
  <label class="field-label">備註(選填，例如：自備餐盒)</label>
  <input type="text" id="orderRemark" placeholder="如有特殊需求請填寫">

  <div id="totalRow">
    <span>總金額</span>
    <span id="totalPrice">$0</span>
  </div>

  <button id="submitBtn">送出預約</button>
  <p id="errorMsg"></p>

  <div id="confirmCard">
    <p class="sub" style="margin:0 0 6px">預約成功</p>
    <p id="confirmDetail" style="font-size:15px;font-weight:600;margin:0"></p>
    <p style="font-size:13px; color:#777; margin-top:8px;">(請關閉此網頁回到 LINE 聊天室)</p>
  </div>

<script>
// ===== ⚠️ 請務必修改這兩個設定 ⚠️ =====
var LIFF_ID = "2011627242-SuwYkGQ8";
var API_URL = "https://script.google.com/macros/s/AKfycbzBEjhmI7AQWfUx16I_D_HljhjVfGdYpNPW_-hPrhLDZw9Tyjf0z4VdgcmdbIhLsSD6/exec";
// ===================================

var menu = [];
var cart = {}; 
var dineOption = "內用";
var userProfile = { displayName: "" };

function renderFlavors() {
  var wrap = document.getElementById("flavors");
  wrap.innerHTML = "";
  menu.forEach(function(f) {
    var soldOut = f.remaining <= 0;
    var currentQty = cart[f.flavor_id] || 0;
    var div = document.createElement("div");
    div.className = "flavor" + (currentQty > 0 ? " selected" : "") + (soldOut ? " soldout" : "");
    var badgeHtml = soldOut ? '<span class="badge out">已售完</span>' : '';
    
    var html = '<div class="flavor-row"><span class="flavor-name">' + f.name + '</span>' + badgeHtml + '</div>';
    html += '<div class="flavor-price">內用 $' + f.price_dinein + ' / 外帶 $' + f.price_takeout + '</div>';
    
    if (!soldOut) {
      html += '<div class="cart-controls">';
      html += '<button class="cart-btn minus" data-id="' + f.flavor_id + '">−</button>';
      html += '<span class="cart-qty">' + currentQty + '</span>';
      html += '<button class="cart-btn plus" data-id="' + f.flavor_id + '">+</button>';
      html += '</div>';
    } else {
      // 💡 已售完提示
      html += '<div class="soldout-notice"> 此口味已完售，請到 LINE 訊息留言詢問還有沒有</div>';
    }
    
    div.innerHTML = html;
    wrap.appendChild(div);
  });

  document.querySelectorAll('.cart-btn.minus').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      if (cart[id] > 0) {
        cart[id]--;
        if (cart[id] === 0) delete cart[id];
        renderFlavors();
        updateTotal();
      }
    });
  });

  document.querySelectorAll('.cart-btn.plus').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      var f = menu.find(function(x) { return x.flavor_id === id; });
      var current = cart[id] || 0;
      if (current < f.remaining && current < 10) {
        cart[id] = current + 1;
        renderFlavors();
        updateTotal();
      } else if (current >= f.remaining) {
        alert("剩餘數量不足");
      }
    });
  });
}

function renderPickupOptions() {
  var sel = document.getElementById("pickupTime");
  sel.innerHTML = "";
  var dayOfWeek = new Date().getDay(); 
  var times = [];

  if (dayOfWeek === 3 || dayOfWeek === 4) {
    times = [
       "11:30","11:45","12:00","12:15","12:30","12:45","13:00","13:15","13:30",
      "--- 晚餐時段 ---",
      "17:00","17:30","17:45","18:00","18:15","18:30","18:45"
    ];
  } else {
    times = ["11:30","11:45","12:00","12:15","12:30","12:45","13:00","13:30"];
  }

  times.forEach(function(t) {
    var opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    if (t === "--- 晚餐時段 ---") {
      opt.disabled = true;
    }
    sel.appendChild(opt);
  });
}

function updateTotal() {
  var total = 0;
  for (var id in cart) {
    var f = menu.find(function(x) { return x.flavor_id === id; });
    if (f) {
      var price = (dineOption === "內用") ? f.price_dinein : f.price_takeout;
      total += price * cart[id];
    }
  }
  document.getElementById("totalPrice").textContent = "$" + total;
}

function loadMenu() {
  fetch(API_URL)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      menu = data.menu || [];
      renderFlavors();
      updateTotal();
    })
    .catch(function() {
      document.getElementById("errorMsg").textContent = "菜單載入失敗,請重新整理";
      document.getElementById("errorMsg").style.display = "block";
    });
}

document.querySelectorAll(".dine-option").forEach(function(el) {
  el.addEventListener("click", function() {
    document.querySelectorAll(".dine-option").forEach(function(x) { x.classList.remove("selected"); });
    el.classList.add("selected");
    dineOption = el.getAttribute("data-value");
    updateTotal();
  });
});

// 如果客人不是用 LINE App 開啟，顯示完成畫面的函數
function showSuccessCard(cartItems, totalPrice, pickupTime) {
  var confirmCard = document.getElementById("confirmCard");
  var summaryText = "共 " + cartItems.length + " 項餐點(" + dineOption + "), 取餐時間 " + pickupTime + "，總計 $" + totalPrice;
  document.getElementById("confirmDetail").textContent = summaryText;
  confirmCard.style.display = "block";
  document.getElementById("submitBtn").style.display = "none";
  cart = {};
  loadMenu();
}

document.getElementById("submitBtn").addEventListener("click", function() {
  var errEl = document.getElementById("errorMsg");
  errEl.style.display = "none";
  var name = document.getElementById("customerName").value.trim();
  var phone = document.getElementById("customerPhone").value.trim();
  var remark = document.getElementById("orderRemark").value.trim();
  var pickupTime = document.getElementById("pickupTime").value;
  
  var cartItems = [];
  for (var id in cart) {
    cartItems.push({ flavor_id: id, qty: cart[id] });
  }

  if (cartItems.length === 0) { errEl.textContent = "請至少選擇一份餐點"; errEl.style.display = "block"; return; }
  if (!name) { errEl.textContent = "請輸入姓名"; errEl.style.display = "block"; return; }
  if (!phone) { errEl.textContent = "請輸入聯絡電話"; errEl.style.display = "block"; return; }

  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "處理中...";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      items: cartItems,
      dine_option: dineOption,
      pickup_time: pickupTime,
      customer_name: name,
      phone: phone,
      remark: remark, 
      line_user_id: userProfile.userId || ""
    })
  })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      if (!result.success) {
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("submitBtn").textContent = "送出預約";
        errEl.textContent = result.message || "送出失敗,請再試一次";
        errEl.style.display = "block";
        loadMenu();
        return;
      }

// 💡 結帳成功後：如果在 LINE 裡面就發送完整明細並關閉網頁
      if (liff.isInClient()) {
        
        // 1. 組合餐點明細 (因為是當日版，直接用 menu 尋找即可)
        var itemsText = "";
        for (var id in cart) {
          var f = menu.find(function(x) { return x.flavor_id === id; });
          if (f) {
            itemsText += f.name + " × " + cart[id] + "\n";
          }
        }

        // 2. 判斷是否有填寫備註
        var remarkText = remark ? ("\n📝 備註：" + remark) : "";

        // 3. 把客人的發言改成系統明細的格式 (已移除日期變數)
        var msgText = '【Telar Studio 預定餐點明細】\n\n' +
                      '👤 姓名：' + name + '\n' +
                      '📞 電話：' + phone + '\n' +
                      '🛍️ 內用/外帶：' + dineOption + '\n' +
                      '⏰ 取餐：' + pickupTime + 
                      remarkText + '\n' +
                      '----------------------\n' +
                      itemsText + 
                      '----------------------\n' +
                      '💰 總計：$' + (result.total_price || 0);

        liff.sendMessages([
          {
            type: 'text',
            text: msgText
          }
        ]).then(function() {
          liff.closeWindow();
        }).catch(function() {
          liff.closeWindow();
        });

      } else {
        showSuccessCard(cartItems, result.total_price, pickupTime);
      }
    })
    .catch(function() {
      document.getElementById("submitBtn").disabled = false;
      document.getElementById("submitBtn").textContent = "送出預約";
      errEl.textContent = "網路連線失敗,請再試一次";
      errEl.style.display = "block";
    });
});

renderPickupOptions();

liff.init({ liffId: LIFF_ID }).then(function() {
  if (liff.isLoggedIn()) {
    liff.getProfile().then(function(profile) {
      userProfile = profile;
      document.getElementById("customerName").value = profile.displayName;
    });
  }
  loadMenu();
}).catch(function() {
  loadMenu();
});
</script>
</body>
</html>
