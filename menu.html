<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本週菜單 - Telar Studio</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 420px; margin: 0 auto; padding: 20px; background: #F7F6F2; color: #222; line-height: 1.6; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; text-align: center; color: #222; }
    
    /* 卡片樣式 */
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 14px; color: #D85A30; border-bottom: 2px solid #F7F6F2; padding-bottom: 8px; }
    
    /* 營業資訊排版 */
    .info-row { display: flex; margin-bottom: 10px; font-size: 14px; }
    .info-label { font-weight: 600; width: 75px; flex-shrink: 0; color: #555; }
    .info-content { color: #333; }
    
    /* 價位標籤 */
    .price-tag { display: inline-block; background: #F7F6F2; padding: 4px 10px; border-radius: 6px; font-size: 13px; margin-right: 8px; font-weight: 600; color: #555; border: 1px solid #eee; }
    
    /* 每日菜單排版 */
    .day-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #eee; }
    .day-row:last-child { border-bottom: none; padding-bottom: 0; }
    .day-date { font-weight: 600; width: 90px; flex-shrink: 0; font-size: 15px; }
    .day-menu { flex: 1; font-size: 15px; color: #222; }
    .day-menu.closed { color: #999; font-weight: 500; }
    .day-menu div { margin-bottom: 4px; }
    .day-menu div:last-child { margin-bottom: 0; }
    
    /* 底部提示 */
    .footer-note { text-align: center; font-size: 13px; color: #999; margin-top: 20px; }
  </style>
</head>
<body>
  
  <h1>Telar Studio<br>本週蔬食菜單</h1>
  
  <!-- 營業資訊區塊 -->
  <div class="card">
    <h2>📌 營業資訊</h2>
    <div class="info-row">
      <div class="info-label">營業時間</div>
      <div class="info-content">
        週一、六、日：11:30 - 14:00<br>
        週三、週四：11:30 - 14:00、17:00 - 19:00<br>
        <span style="color:#D85A30; font-weight:600;">週二、週五：店休</span>
      </div>
    </div>
    <div class="info-row" style="margin-top:14px; align-items:center;">
      <div class="info-label">餐點價格</div>
      <div class="info-content">
        <span class="price-tag">內用 $220</span>
        <span class="price-tag">外帶 $140</span>
      </div>
    </div>
  </div>

  <!-- 本週菜單區塊 -->
  <div class="card">
    <h2>🗓️ 9/21-9/27 菜單</h2>
    
    <div class="day-row">
      <div class="day-date">9/21 (一)</div>
      <div class="day-menu">
        <div>五味醬豆腐</div>
        <div>胡麻豆包</div>
      </div>
    </div>
    
    <div class="day-row">
      <div class="day-date">9/22 (二)</div>
      <div class="day-menu closed">店休</div>
    </div>

    <div class="day-row">
      <div class="day-date">9/23 (三)</div>
      <div class="day-menu">
        <div>椒麻豆包</div>
        <div>打拋豆腐</div>
      </div>
    </div>

    <div class="day-row">
      <div class="day-date">9/24 (四)</div>
      <div class="day-menu">
        <div>蕃茄鷹嘴豆</div>
        <div>京醬豆包</div>
      </div>
    </div>

    <div class="day-row">
      <div class="day-date">9/25 (五)</div>
      <div class="day-menu closed">店休</div>
    </div>

    <div class="day-row">
      <div class="day-date">9/26 (六)</div>
      <div class="day-menu">
        <div>日式咖哩</div>
        <div>蕃茄杏鮑菇豆腐</div>
      </div>
    </div>

    <div class="day-row">
      <div class="day-date">9/27 (日)</div>
      <div class="day-menu">
        <div>猴菇燉豆腐</div>
        <div>糖醋豆包</div>
      </div>
    </div>
  </div>
  
  <p class="footer-note">如需預定當日餐點，請點Line選單的「預定餐點」</p>

</body>
</html>
